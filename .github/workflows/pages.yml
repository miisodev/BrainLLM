name: Deploy landing site

# The site is five static files in /docs with no build step. Pages was
# previously served straight off the branch (build_type: legacy), which cannot
# accept an artifact from actions/deploy-pages — every deployment sat in
# deployment_queued until it timed out, while the last good branch build kept
# serving. The result was a live site that was up, green to a uptime check, and
# three commits behind: it advertised v10.1.0 on the day v10.2.0 was tagged.
#
# Pages is now build_type: workflow, which needs this file to exist. Without it
# nothing deploys at all, which is quieter than the old failure and worse.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; never cancel one half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify deployed version and pages
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          URL="${{ steps.deployment.outputs.page_url }}"
          test -n "$URL"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$URL" | grep -Fq "v${VERSION} · open source"; then
              for page in index.html how-it-works.html use-cases.html pricing.html docs.html; do
                curl --fail --silent --show-error "$URL/$page" >/dev/null
              done
              echo "Pages ${URL} serves v${VERSION}"
              exit 0
            fi
            echo "Pages has not served v${VERSION} yet (${attempt}/12)"
            sleep 15
          done
          echo "::error::Pages did not serve v${VERSION} after deployment"
          exit 1
