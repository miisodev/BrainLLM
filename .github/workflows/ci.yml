name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - run: bun install --frozen-lockfile

      # `bun build` bundles without type-checking, so a genuine type error
      # produces a clean build and a green CI. Check types explicitly — a
      # missing import shipped this way and was only caught by running tsc
      # by hand.
      - name: Type check
        run: bunx tsc --noEmit

      - run: bun run build

      # Every *.test.ts, discovered rather than listed.
      #
      # This used to name each suite explicitly, which meant a new suite was
      # outside CI until someone remembered to add it — and nothing failed when
      # they didn't. It happened twice: oauth.test.ts (the CIMD impersonation
      # and code-harvesting tests, written specifically to run against hostile
      # documents) sat outside CI for a release, and kinds.test.ts did the same
      # the day it was written. A list that must be maintained by hand to stay
      # correct will eventually be wrong, and its being wrong looks exactly like
      # its being right: green.
      #
      # src/test.ts is excluded by the pattern, not by omission — it is the
      # integration runner and needs a live Trilium instance.
      - name: Unit tests
        run: bun test src/*.test.ts
