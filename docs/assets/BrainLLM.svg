<?xml version="1.0" encoding="UTF-8"?>
<!--
  BrainLLM mark.

  A 3x3 grid of nodes, six lit and three dark — the same figure the site's
  wordmark carries. It reads as a small graph rather than a brain, which is
  what the product actually is: typed nodes, some connected, some not yet.

  Geometry is exact so it stays crisp at every raster size: a 512 canvas, dots
  of r=38 on a 92px pitch, centred on 164 / 256 / 348 in both axes.

  The plate is part of the mark, not a backdrop. Rasterised icons are served
  into favicon and connector slots that sit on unknown backgrounds, and amber
  dots alone would disappear against a light one.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="BrainLLM">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="#0a0a0f"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <rect x="1" y="1" width="510" height="510" rx="113" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>

  <g fill="#f59e0b">
    <circle cx="164" cy="164" r="38"/>
    <circle cx="348" cy="164" r="38"/>
    <circle cx="164" cy="256" r="38"/>
    <circle cx="256" cy="256" r="38"/>
    <circle cx="256" cy="348" r="38"/>
    <circle cx="348" cy="348" r="38"/>
  </g>
  <g fill="#3f3f46">
    <circle cx="256" cy="164" r="38"/>
    <circle cx="348" cy="256" r="38"/>
    <circle cx="164" cy="348" r="38"/>
  </g>
</svg>
