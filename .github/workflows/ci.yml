name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1"

      - run: bun install --frozen-lockfile

      # The npm lockfile is also published as a contributor convenience, so a
      # stale one must fail the gate rather than waiting for an npm user to
      # discover it. Dry-run keeps this check metadata-only.
      - name: npm lockfile integrity
        run: npm ci --ignore-scripts --dry-run

      - name: Dependency audit
        run: bun audit --audit-level=high

      - name: MCPB manifest validation
        run: bun run validate:manifest

      # `bun build` bundles without type-checking, so a genuine type error
      # produces a clean build and a green CI. Check types explicitly — a
      # missing import shipped this way and was only caught by running tsc
      # by hand.
      - name: Type check
        run: bunx tsc --noEmit

      - run: bun run build

      - name: HTTP authentication smoke
        run: bun run test:http

      # Every *.test.ts, discovered by Bun itself. This is deliberately not a
      # shell glob: the same command then works in PowerShell on Windows and in
      # the Ubuntu runner, instead of passing locally while matching no files.
      #
      # src/test.ts is excluded by Bun's test discovery because it is the
      # integration runner and needs a live Trilium instance.
      - name: Unit tests
        run: bun run test:unit

      # Release metadata, checked on every push rather than at tag time.
      #
      # server.json sat INVALID against its own declared schema for four
      # releases — a 259-character description against a 100-character limit —
      # because nothing validated it. The file was maintained and version-bumped
      # the whole time. The registry would have rejected it at publish, which is
      # the most expensive moment to discover it: the npm half of a release is
      # immutable by then.
      - name: Release metadata
        run: bun run validate:release
